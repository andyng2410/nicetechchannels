services:
  nicetechchannels:
    build: .
    image: nicetechchannels:local
    container_name: nicetechchannels
    # Chỉ mở trên loopback: web_server.py bind 0.0.0.0 và không có auth.
    ports:
      - "127.0.0.1:8765:8765"
    # slide/ bind mount từ host để deck builder hoạt động: codex chạy trên host
    # (deck_host_runner.py) ghi vào slide/, container thấy ngay và ngược lại.
    # config/ vẫn là volume Docker (giữ OAuth token đã lưu trong container).
    volumes:
      - ./slide:/app/slide
      - ntc-config:/app/config
    environment:
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
      AUTH_TOKEN: "${AUTH_TOKEN:-}"
      CT0: "${CT0:-}"
    security_opt:
      - no-new-privileges:true
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  # ntc-slides: dữ liệu cũ trước khi chuyển sang bind mount ./slide (đã sync về host
  # 17/08/2026). Giữ làm backup, xoá bằng `docker volume rm nicetechchannels_ntc-slides`.
  ntc-slides:
  ntc-config:
